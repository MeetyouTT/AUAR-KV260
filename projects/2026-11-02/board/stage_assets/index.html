<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汐蓝 · 实时交互演示</title>
<style>
:root{color-scheme:dark;font-family:'Microsoft YaHei',system-ui,sans-serif;color:#e4efff;background:#0a1728}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 20%,#153951,#0a1728 65%);min-height:100vh}main{max-width:1100px;margin:0 auto;padding:34px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:25px}h1{font-size:30px;margin:0 0 8px}p{color:#aac4de;line-height:1.7;margin:0}.badge{font-size:13px;border:1px solid #305571;border-radius:24px;padding:8px 14px;color:#9dd6e3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.card{border:1px solid #284961;background:#13263adb;border-radius:20px;padding:22px}.portrait{display:flex;justify-content:center;align-items:center;background:#16293f;border-radius:14px;min-height:480px;overflow:hidden}#avatar{width:100%;max-width:464px;aspect-ratio:464/480;object-fit:contain}.status{margin-top:16px;display:flex;align-items:center;gap:10px}.dot{width:8px;height:8px;background:#69dbbc;border-radius:50%;box-shadow:0 0 12px #69dbbc80}#reply{min-height:60px;font-size:14px;margin-top:10px;color:#c3d7ea}h2{font-size:17px;margin:0 0 14px}label{display:block;font-size:14px;margin-bottom:8px}textarea,input,select,button{font:inherit}textarea,input,select{color:#e4efff;background:#0c1e32;border:1px solid #36566d;border-radius:10px;padding:12px;width:100%}textarea{resize:vertical;min-height:117px}.row{display:flex;gap:10px;margin:14px 0}.row>*{flex:1}button{cursor:pointer;background:#244862;color:#dfeefb;border:1px solid #386c8c;padding:12px;border-radius:10px;transition:background .15s}button:hover{background:#316385}.primary{width:100%;background:#287c91;font-weight:600;margin:0 0 12px}.primary:hover{background:#3197ac}.sub{font-size:12px;color:#93b4cf;line-height:1.6}hr{border:0;border-top:1px solid #284961;margin:22px 0}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small button{padding:10px;font-size:13px}#error{color:#ffbeab;font-size:13px;line-height:1.6;margin-top:12px}button:disabled{opacity:.5;cursor:default}.model{margin-top:24px}#diagnostics{display:none}@media(max-width:760px){main{padding:18px}.grid{grid-template-columns:1fr}header{align-items:flex-start}.portrait{min-height:360px}}
</style></head><body><main><header><div><h1>汐蓝</h1><p>DeepSeek 鲸鱼娘 · 柔亮俏皮</p></div><span class="badge">本机实时演示</span></header><div class="grid"><section class="card"><div class="portrait"><img id="avatar" alt="汐蓝的实时动画画面"></div><div class="status"><span class="dot"></span><strong id="status">连接演示窗口…</strong></div><p id="reply"></p><p class="sub">声音由本机演示窗口播放，口型跟随音频，眨眼独立运行。</p></section><section class="card"><h2>让汐蓝说一句</h2><label for="text">台词（最多 240 字）</label><textarea id="text" maxlength="240">你好呀，我是汐蓝。很高兴见到你，今天想聊点什么？</textarea><div class="row"><div><label for="emotion">表情</label><select id="emotion"><option value="neutral">平静</option><option value="happy">开心</option><option value="sad">温柔安慰</option></select></div><div><label for="action">动作</label><select id="action"><option value="">自然说话</option><option value="ack_nod">先点头</option><option value="deny_shake">先摇头</option><option value="emo_surprised">先惊讶</option><option value="emo_puzzled">先疑惑</option></select></div></div><button id="speak" class="primary">开始说话</button><div class="row"><button id="pause">暂停 / 继续</button><button id="cancel">打断</button></div><p class="sub">首次生成新台词需要等待；已准备好的台词可以直接播放。</p><hr><h2>快速体验</h2><div class="quick"><button data-demo="0">打招呼</button><button data-demo="1">开心回应 · 点头</button><button data-demo="2">轻声安慰</button><button data-demo="3">长句说明</button></div><hr><h2>场景状态</h2><div class="row small"><button data-event="person_enter">有人靠近</button><button data-event="wake">唤醒</button><button data-event="listen">倾听</button><button data-event="reset">重置</button></div><div id="error" role="status"></div></section></div><section class="card model"><h2>对话服务</h2><p id="modelStatus">对话模型未连接 · 可在另一台电脑接入</p><div class="row"><input id="dialogueText" aria-label="发送给对话模型的内容" placeholder="配置服务后，可在这里与汐蓝对话" disabled><button id="dialogue" disabled>发送对话</button></div><p class="sub">当前可直接输入台词检查素材表现。接入说明保存在共享文件夹的移机交接文档中。</p></section><output id="diagnostics"></output></main><script src="/player.js"></script></body></html>
