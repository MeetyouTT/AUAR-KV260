<body><main>
  <div class="hero"><img class="portrait" src="assets/avatar.png" alt="蓝发角色小光"><div><div class="eyebrow">AURA / VOICE ROUND 02</div><h1>更轻、更年轻的少女声线</h1><p class="intro">按“声音太成熟”的反馈，重新设计两款声线。先听年轻感是否合适，再决定完整台词。</p></div></div>
  <div class="brief"><strong>选择结果：柔亮俏皮</strong><p>两款新声线使用相同的两句台词；“柔亮俏皮”已进入固定声线与四场景制作。</p></div>
  <div id="cards" class="grid" aria-label="年轻声线试听"></div><div id="message" role="status" aria-live="polite"></div>
  <div class="guide"><strong>听声音本身，再听表演</strong><p>先判断是否还显得成熟，是否足够轻亮，是否听起来舒服。如果声音接近目标，后续再细调活泼程度与停顿。</p></div>
  <p class="footer">音量已作近似对齐，原件与提示词另行保留。<a href="http://127.0.0.1:8768/">查看上一轮三款对照</a></p>
