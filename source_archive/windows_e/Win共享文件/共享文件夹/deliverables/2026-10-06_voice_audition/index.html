<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小光 · 找到她的声音</title>
  <style>
    :root{color-scheme:light;--ink:#253447;--soft:#667489;--line:#dce7ec;--blue:#35679f;--mint:#e5f3ef}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f4f8fa;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:15px;line-height:1.7}
    main{max-width:1180px;margin:auto;padding:40px 28px 60px}.hero{display:flex;align-items:center;gap:28px;margin-bottom:28px}.portrait{width:115px;height:148px;object-fit:contain;object-position:bottom;background:#fff;border-radius:24px;border:1px solid var(--line)}
    h1{font-size:32px;line-height:1.3;margin:8px 0 12px;font-weight:650;letter-spacing:.02em}p{margin:8px 0}.eyebrow{font-size:12px;color:var(--blue);letter-spacing:.12em}.intro{max-width:740px;color:var(--soft)}
    .brief{background:#eaf1fa;border:1px solid #d1dff0;border-radius:16px;padding:16px 20px;margin-bottom:26px}.brief strong{color:#234d7d}.brief p{margin:3px 0;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
    .card{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 26px #36506706}.card.featured{border:2px solid #9ebadc;padding:23px}.card.playing{box-shadow:0 0 0 3px #c5d9f2}.badge{display:inline-block;background:var(--mint);color:#376453;font-size:12px;padding:3px 10px;border-radius:20px}.card h2{font-size:25px;line-height:1.3;margin:12px 0 4px}.description{min-height:48px;color:var(--soft);font-size:14px}.style{color:var(--soft);font-size:12px;min-height:40px;margin:12px 0}
    button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#f7fafc;color:var(--ink);padding:8px 12px;transition:background .15s}button:hover{background:#edf3fb}button:focus-visible,a:focus-visible{outline:3px solid #86aad7;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.play-all{width:100%;background:var(--blue);color:white;border-color:var(--blue);font-weight:550;padding:11px}.play-all:hover{background:#285583}.scenes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.scene{font-size:13px;padding:8px}.scene.active{background:#e4effc;border-color:#88acd6;color:#285583}.card audio{width:100%;height:36px;margin:10px 0;display:block}.spoken{min-height:162px;padding:13px 14px;border-radius:12px;background:#f5f8fb;font-size:13px;color:#586a7f}.spoken b{display:block;font-size:12px;margin-bottom:5px;color:#38618d}.spoken p{margin:0;line-height:1.85}.download{display:inline-block;margin-top:14px;font-size:12px;color:var(--blue);text-underline-offset:3px}.status{font-size:12px;color:var(--soft);margin-top:14px}.guide{margin-top:28px;padding:20px 24px;border-radius:16px;background:#fff;border:1px solid var(--line)}.guide p{font-size:14px;color:var(--soft)}.guide strong{color:var(--ink)}.footer{font-size:12px;color:var(--soft);margin-top:24px}.error{padding:20px;border:1px solid #e5c5c5;background:#fff5f5;border-radius:12px}
    @media(max-width:780px){.grid{grid-template-columns:1fr}.card .description,.card .style,.spoken{min-height:0}.hero{gap:18px}.card{padding:22px}.scenes{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:550px){main{padding:24px 16px}.portrait{width:76px;height:108px;border-radius:16px}h1{font-size:23px}.intro{font-size:13px}.scenes{grid-template-columns:1fr 1fr}.hero{align-items:start;gap:14px}}
  </style>
</head>
<body>
<main>
  <div class="hero">
    <img class="portrait" src="assets/avatar.png" alt="蓝发角色小光">
    <div>
      <div class="eyebrow">AURA / VOICE AUDITION</div>
      <h1>找到小光的声音</h1>
      <p class="intro">同样的四段台词，听听哪个声音更适合她。可以从日常问候开始，再比较兴奋和安慰时的变化。</p>
    </div>
  </div>
  <div class="brief"><strong>本轮方向：清亮活泼，像游戏中的少女</strong><p>重点试听 Vivian；Serena 和现有声音作为对照。最终声音由试听决定。</p></div>
  <div id="cards" class="grid" aria-label="音色试听"></div>
  <div id="message" role="status" aria-live="polite"></div>
  <div class="guide">
    <strong>先听舒服，再听角色感</strong>
    <p>听日常问候是否自然，长句是否耐听，兴奋时是否尖锐，安慰时是否仍像同一个人。</p>
    <p>不满意时可以告诉我“声音太厚”“不够明亮”“太甜”“语调太平”或“长句累”。这样下一轮能更有针对性。</p>
  </div>
  <p class="footer">试听音量已作近似对齐，生成原件另行保留。此页用于声音比较，尚未接入正式玩偶。</p>
</main>
<script src="player.js"></script>
</body>
</html>
