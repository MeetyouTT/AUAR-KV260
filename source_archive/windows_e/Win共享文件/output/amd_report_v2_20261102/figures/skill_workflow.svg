<polyline points="860,300 940,300" fill="none" stroke="#1762A5" stroke-width="4" stroke-linejoin="round"/>
<polygon points="940.000,300.000 927.000,306.000 927.000,294.000" fill="#1762A5"/>
<text x="40" y="485" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#536576">同一生成器用于加法和CRC两类布局；黄金参考与模拟实现独立。</text>
<text x="40" y="536" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#536576">本次验证层级为离线生成与模拟。真实PYNQ、跨板和整机复现分别记录。</text>
