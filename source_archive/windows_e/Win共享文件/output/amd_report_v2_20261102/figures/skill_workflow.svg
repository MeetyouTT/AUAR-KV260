<text x="1050" y="305" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#142638">单元和示例执行</text>
<text x="1050" y="353" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#142638">保存结果与边界</text>
<polyline points="260,300 340,300" fill="none" stroke="#1762A5" stroke-width="4" stroke-linejoin="round"/>
