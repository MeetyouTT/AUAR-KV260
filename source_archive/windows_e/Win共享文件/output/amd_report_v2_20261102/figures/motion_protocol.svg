<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<title>AUAR AMD 设计报告配图</title>
<desc>系统结构、接口和离线验证工作流</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="55" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#142638">运动命令与执行许可</text>
<text x="40" y="118" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#536576">命令字段：session / epoch / seq / target / lease</text>
<rect x="40" y="220" width="220" height="220" rx="12" fill="#F7F9FB" stroke="#AAB8C4" stroke-width="2"/>
<text x="150" y="274" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#142638">PS 检查</text>
<text x="150" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#142638">目标与源帧时效</text>
<text x="150" y="380" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#142638">形成有限请求</text>
<rect x="340" y="220" width="220" height="220" rx="12" fill="#F7F9FB" stroke="#AAB8C4" stroke-width="2"/>
<text x="450" y="274" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#142638">提交与许可</text>
<text x="450" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#142638">上下文 / 序号</text>
<text x="450" y="380" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#142638">脉宽 / 租约</text>
<rect x="640" y="220" width="220" height="220" rx="12" fill="#F7F9FB" stroke="#AAB8C4" stroke-width="2"/>
<text x="750" y="274" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#142638">帧边界推进</text>
<text x="750" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#142638">目标限速推进</text>
<text x="750" y="380" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#142638">独立帧时序</text>
<rect x="940" y="220" width="220" height="220" rx="12" fill="#F7F9FB" stroke="#AAB8C4" stroke-width="2"/>
<text x="1050" y="274" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#142638">PWM 输出</text>
<text x="1050" y="335" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#142638">输出到接口电路</text>
<text x="1050" y="380" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#142638">机械反馈另验</text>
<polyline points="260,330 340,330" fill="none" stroke="#1762A5" stroke-width="4" stroke-linejoin="round"/>
<polygon points="340.000,330.000 327.000,336.000 327.000,324.000" fill="#1762A5"/>
<polyline points="560,330 640,330" fill="none" stroke="#1762A5" stroke-width="4" stroke-linejoin="round"/>
<polygon points="640.000,330.000 627.000,336.000 627.000,324.000" fill="#1762A5"/>
<polyline points="860,330 940,330" fill="none" stroke="#1762A5" stroke-width="4" stroke-linejoin="round"/>
<polygon points="940.000,330.000 927.000,336.000 927.000,324.000" fill="#1762A5"/>
<text x="40" y="505" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#536576">STOP或租约失效关闭许可；源帧绝对时效由PS检查，PL租约从命令接受时起计时。</text>
<text x="40" y="555" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#536576">数据总线写成功、命令被接受、实际机械到位，分别使用相应证据确认。</text>
</svg>