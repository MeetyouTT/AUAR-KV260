<text x="40" y="768" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#536576">运行链与开发链分开：Ubuntu承担构建、量化和编译；各节点版本及接口需要配套。</text>
