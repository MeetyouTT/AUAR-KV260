<text x="1134" y="978" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#52617a">从 1–8 中配置一根输出 PWM</text>
<text x="78" y="1075" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#33445e">注意：这些信号脚不会默认输出 PWM；H12 等是 FPGA 封装脚名称，不是插口针号。</text>
<text x="78" y="1124" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#67758b">来源：Xilinx 载板原理图 Rev B03；Xilinx Kria-PYNQ base.xdc。图内针号与常见 Pmod 标准编号不同。</text>
