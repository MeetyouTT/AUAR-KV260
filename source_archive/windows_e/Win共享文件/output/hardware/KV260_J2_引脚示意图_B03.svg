<text x="616" y="933" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#14233d">9 或 10 → GND1</text>
<text x="616" y="978" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#52617a">隔离模块的 KV260 侧地</text>
