<rect x="74" y="830" width="1592" height="197" rx="16" fill="#ffffff" stroke="#dce3ef" stroke-width="2"/>
<text x="98" y="877" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#14233d">连接到你的 ADuM1201 隔离模块（KV260 侧）</text>
<text x="98" y="933" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#14233d">11 或 12 → VDD1</text>
