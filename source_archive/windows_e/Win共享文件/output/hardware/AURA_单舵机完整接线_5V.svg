<text x="1432" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#c54934">VBAT</text>
<text x="1645" y="509" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#526071">输入 G</text>
<text x="1590" y="614" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#1c2c44">SVPDB-8S</text>
<text x="1590" y="661" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#9d511e">12 V → 5 V 降压</text>
<text x="1430" y="562" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#c54934">Vx：5 V</text>
<text x="1430" y="720" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#2268c8">信号输入 1</text>
<text x="1430" y="777" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#526071">G：电池侧地</text>
<text x="1590" y="840" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#52617a">舵机输出端：第 1 列</text>
