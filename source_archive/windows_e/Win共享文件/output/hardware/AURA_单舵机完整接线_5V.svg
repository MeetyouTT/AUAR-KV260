<text x="1590" y="373" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#52617a">红黑线的正负极先实测</text>
<polyline points="1470,393 1470,470" fill="none" stroke="#c54934" stroke-width="5"/>
<polygon points="1470,470 1461,455 1479,455" fill="#c54934"/>
<polyline points="1700,393 1700,470" fill="none" stroke="#526071" stroke-width="5"/>
