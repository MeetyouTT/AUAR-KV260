<text x="250" y="522" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1c2c44">J2 11 或 12</text>
<text x="250" y="562" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#c54934">3.3 V</text>
<text x="250" y="643" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1c2c44">J2 1*：PWM</text>
<text x="250" y="683" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#52617a">拟选封装脚 H12</text>
<text x="250" y="774" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1c2c44">J2 9 或 10</text>
