<polygon points="1470,1044 1461,1029 1479,1029" fill="#2268c8"/>
<text x="1483" y="945" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#2268c8">信号 1</text>
<polyline points="1590,870 1590,1044" fill="none" stroke="#c54934" stroke-width="5"/>
<polygon points="1590,1044 1581,1029 1599,1029" fill="#c54934"/>
<text x="1603" y="943" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#c54934">Vx 5 V</text>
<polyline points="1710,870 1710,1044" fill="none" stroke="#526071" stroke-width="5"/>
<polygon points="1710,1044 1701,1029 1719,1029" fill="#526071"/>
<text x="1723" y="943" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#526071">G</text>
<rect x="1390" y="1044" width="400" height="184" rx="18" fill="#ffffff" stroke="#e6b589" stroke-width="2"/>
<text x="1470" y="1081" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#2268c8">信号 S</text>
<text x="1590" y="1081" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#c54934">正极 +</text>
<text x="1710" y="1081" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#526071">负极 −</text>
<text x="1590" y="1143" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" text-anchor="middle" fill="#1c2c44">DS3230 舵机</text>
<text x="1590" y="1194" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#52617a">三线按标识插第 1 列</text>
<rect x="60" y="953" width="1270" height="314" rx="18" fill="#ffffff" stroke="#dae2ed" stroke-width="2"/>
<text x="88" y="1003" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" text-anchor="start" fill="#1c2c44">接线前确认</text>
<text x="88" y="1055" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#334861">*J2 1 号 / H12 是拟选 PWM 脚，须先在 FPGA 工程中配置。</text>
<text x="88" y="1097" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#334861">供电板“6V”和“7.2V”两组焊桥均开路，输出设为 5 V。</text>
<text x="88" y="1140" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#334861">GND1 与 GND2 不连接；12 V 只接供电板 VBAT / 输入 G。</text>
<text x="88" y="1182" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#334861">先空载测 Vx 对 G 约为 5 V；确认 PWM 后再接舵机测试。</text>
<text x="88" y="1223" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#334861">停机先断舵机电池；线色以实物标识与测量为准。</text>
<text x="65" y="1324" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#627189">依据：Xilinx B03 载板原理图与官方 XDC、ADI ADuM1201 数据手册、MATEKSYS SVPDB-8S 资料。</text>
<text x="65" y="1366" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#627189">SVPDB 编号 1 是供电板的信号通道，和 KV260 J2 的针号不是同一套编号。</text>
</svg>