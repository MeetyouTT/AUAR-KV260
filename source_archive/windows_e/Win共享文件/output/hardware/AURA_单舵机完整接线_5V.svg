<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1380" viewBox="0 0 1900 1380">
<title>AURA KV260 单舵机完整接线方案，5V</title>
<desc>逻辑连接示意，非实物针脚位置。12V电池经SVPDB-8S降为5V，供舵机及ADuM1201侧2。KV260的3.3V、地、拟选PWM分别连接VDD1、GND1、VIB。VIB经隔离送到VOB，再经供电板信号1送舵机。两侧地不连接。KV260针号参照B03原理图，尚需确认用户载板及PWM工程。</desc>
<rect x="0" y="0" width="1900" height="1380" rx="0" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="66" y="95" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="55" font-weight="700" text-anchor="start" fill="#1c2c44">KV260 + 单舵机 · 完整接线图</text>
<text x="70" y="160" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#50617a">12 V 独立电池 → SVPDB-8S → 5 V｜PWM 使用 ADuM1201 的 VIB → VOB 通道</text>
<rect x="60" y="196" width="1780" height="63" rx="12" fill="#fff0d9" stroke="none" stroke-width="2"/>
<text x="84" y="236" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#85471b">逻辑连接示意，非实物针脚位置。KV260 针号按 B03 原理图；实物版本和 PWM 工程需确认。</text>
