<text x="940" y="563" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1c2c44">VDD2</text>
<text x="940" y="645" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#1c2c44">VOB</text>
