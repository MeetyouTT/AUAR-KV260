  <g id="text_19">
   <text style="font-family:Noto Sans CJK JP;font-size:17px;font-stretch:normal;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 378, 28.002938)" x="378" y="28.002938">SFace验证准确率变化：累计统计</text>
