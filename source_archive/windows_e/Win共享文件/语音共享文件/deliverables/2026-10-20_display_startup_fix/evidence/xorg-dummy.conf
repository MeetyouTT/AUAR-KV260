Section "InputDevice"
	Identifier	"System Mouse"
	Driver		"mouse"
	Option		"Device" "/dev/input/mouse0"
EndSection

Section "InputDevice"
	Identifier	"System Keyboard"
	Driver		"kbd"
	Option		"Device" "/dev/input/event0"
EndSection

Section "Device"
        Identifier      "ZynqMP"
        Driver          "dummy"
        Option          "BusId"                 "fd4a0000.display"
        Option          "DRI2"                  "true"
        Option          "DRI2_PAGE_FLIP"        "false"
        Option          "DRI2_WAIT_VSYNC"       "true"
        Option          "SWcursorLCD"           "false"
        Option          "DEBUG"                 "false"
        Option          "Monitor-DUMMY0"          "AURA-HDMI"
EndSection

# Exact 49 MHz timing read from this panel's verified EDID.
# The narrow sync ranges enclose 37.34756 kHz / 59.85186 Hz.
Section "Monitor"
        Identifier      "AURA-HDMI"
        HorizSync       37.34-37.36
        VertRefresh     59.84-59.86
        Modeline        "1024x600" 49.000 1024 1072 1168 1312 600 603 613 624 -HSync -VSync
        Option          "PreferredMode" "1024x600"
        Option          "Primary" "true"
EndSection

Section "Screen"
        Identifier      "DefaultScreen"
        Device          "ZynqMP"
        Monitor         "AURA-HDMI"
        DefaultDepth    16
        SubSection "Display"
                Depth   16
                Modes   "1024x600"
        EndSubSection
EndSection

Section "ServerFlags"
 Option "AutoAddDevices" "false"
 Option "AutoEnableDevices" "false"
 Option "AutoAddGPU" "false"
 Option "DontVTSwitch" "true"
EndSection
