[Unit]
Requires=aura-original-wide-prepare.service aura-camera-ui.service
After=aura-original-wide-prepare.service aura-camera-ui.service
Wants=aura-boot-ready.service

[Service]
# Runs for EACH normal GUI start, including same-boot camera owner changes.
ExecStartPre=/usr/bin/python3 -B /usr/local/lib/aura-boot-recovery/v1/boot_recovery.py bind-camera
# Avoid an outer start timeout killing a source-binding helper. The original
# launcher retains its own display/business READY checks and failure reporting.
TimeoutStartSec=infinity
Restart=no
