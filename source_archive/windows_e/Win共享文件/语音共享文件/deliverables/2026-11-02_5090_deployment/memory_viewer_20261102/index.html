<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>板端记忆库 · AURA</title>
<style>
:root{font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;color:#203548;background:#f3f6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{padding:28px 30px 24px;background:#17384a;color:white}header .top{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:26px;letter-spacing:1px;margin:0 0 9px}header p{font-size:13px;color:#c5d8e2;margin:0}.badge{font-size:12px;white-space:nowrap;background:#315867;border:1px solid #7595a3;padding:6px 12px;border-radius:20px}main{max-width:1100px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat{background:white;padding:17px;border:1px solid #e1e8ed;border-radius:10px}.stat span{font-size:12px;color:#728491}.stat strong{display:block;font-size:25px;margin-top:8px;font-weight:600;color:#17536a}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button,input{font:inherit}button{cursor:pointer;transition:background .12s;border-radius:7px;border:1px solid #d4e0e7;background:white;color:#365368;padding:9px 12px;font-size:13px}button:hover{background:#e8f1f4}button.active{background:#1b5e73;color:white;border-color:#1b5e73}button:disabled{opacity:.45;cursor:default}.search{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search input{flex:1;min-width:150px;border:1px solid #cbd9e0;border-radius:7px;background:white;padding:10px 12px;outline-color:#32819a;font-size:14px}.summary{font-size:12px;color:#6e8290;display:flex;justify-content:space-between;gap:12px;padding:4px 0 16px}.card{padding:20px 22px;background:white;border:1px solid #dfe7ec;border-radius:10px;margin-bottom:12px}.meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#758693;margin-bottom:12px}.tag{font-size:11px;display:inline-block;background:#eaf3f6;color:#32667b;padding:3px 7px;border-radius:4px;max-width:50%;overflow-wrap:anywhere}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:14px}.keywords{font-size:11px;color:#68808f;line-height:1.6;margin-top:12px}.notice{padding:34px 20px;text-align:center;color:#738895;border:1px dashed #c6d7e0;border-radius:10px;background:#f9fbfc;line-height:1.9}.pagination{display:flex;justify-content:center;align-items:center;gap:16px;padding:18px}.pagination span{font-size:13px;color:#6d8390}footer{border-top:1px solid #dae4e9;padding:16px 4px;color:#81939e;font-size:11px;line-height:1.8}.error{color:#a84435}#loading{color:#3a728a} @media(max-width:600px){header{padding:22px 18px}main{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.card{padding:16px}.meta{flex-direction:column}.tag{max-width:100%}}
</style></head><body>
<header><div class="top"><div><h1>板端记忆库</h1><p>AURA · 对话、观察与事实</p></div><span class="badge">只读查看</span></div></header>
<main><section class="stats"><div class="stat"><span>有效摘要</span><strong id="summaries">—</strong></div><div class="stat"><span>对话记录</span><strong id="conversations">—</strong></div><div class="stat"><span>明确事实</span><strong id="facts">—</strong></div><div class="stat"><span>近期原文</span><strong id="recent">—</strong></div></section>
<nav class="toolbar" id="tabs"><button data-kind="conversation" class="active">对话摘要</button><button data-kind="vision">视觉摘要</button><button data-kind="device">设备摘要</button><button data-kind="all">全部摘要</button><button data-kind="facts">明确事实</button><button data-kind="recent">近期原文</button></nav>
<form class="search" id="search"><input id="query" type="search" maxlength="100" placeholder="搜索当前分类中的内容或关键词" aria-label="搜索记忆"><button type="submit">搜索</button><button id="refresh" type="button">刷新</button></form>
<div class="summary"><span id="count">正在连接板卡…</span><span id="updated"></span></div>
<section id="items" aria-live="polite"><div class="notice" id="loading">正在读取当前记忆…</div></section>
<div class="pagination"><button id="prev">上一页</button><span id="page">第 1 页</span><button id="next">下一页</button></div>
<footer>数据来自板卡当前记忆库；每页最多显示 20 条。较早的原文会按现有流程整理成摘要，可在摘要分类中查看。个人档案内容通过板端“个人记忆”入口访问。</footer></main>
<script>
let kind='conversation',page=0,total=0,busy=false;
const el=id=>document.getElementById(id);
const labels={user_said:'用户话语',assistant_played:'已播放回答',assistant_reply:'生成回答',camera_observed:'视觉观察',device_event:'设备事件',memory_command:'记忆操作'};
function time(value){return value?new Date(value).toLocaleString('zh-CN',{timeZone:'America/Los_Angeles',hour12:false}):'时间未提供'}
function node(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n}
function updateButtons(){el('prev').disabled=busy||page===0;el('next').disabled=busy||(page+1)*20>=total;el('page').textContent=`第 ${page+1} / ${Math.max(1,Math.ceil(total/20))} 页`}
async function load(){if(busy)return;busy=true;updateButtons();el('count').textContent='正在读取…';el('items').replaceChildren(node('div','notice','正在读取当前记忆…'));
try{const params=new URLSearchParams({kind,page:String(page),q:el('query').value.trim()});const response=await fetch('./api/memory?'+params,{cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'读取失败');total=data.total;
for(const key of ['summaries','conversations','facts','recent'])el(key).textContent=data.counts[key].toLocaleString('zh-CN');
el('count').textContent=`当前分类共 ${total.toLocaleString('zh-CN')} 条 · 按时间倒序`;el('updated').textContent='刷新于 '+time(data.observed_utc);el('items').replaceChildren();
for(const item of data.items){const card=node('article','card');const meta=node('div','meta');meta.append(node('span','tag',labels[item.label]||item.label||'记忆摘要'),node('span','',time(item.start)+(item.end!==item.start?' — '+time(item.end):'')));card.append(meta,node('div','body',item.text||'这条记录没有文字摘要。'));
if(item.keywords){let words=item.keywords;try{const parsed=JSON.parse(words);if(Array.isArray(parsed))words=parsed.join(' · ')}catch{}card.append(node('div','keywords','关键词：'+words))}el('items').append(card)}
if(!data.items.length)el('items').append(node('div','notice',kind==='recent'?'当前没有符合条件的近期原文。较早内容请查看摘要。':'当前分类没有符合条件的记录。'));
}catch(error){el('count').textContent='连接暂不可用';el('items').replaceChildren(node('div','notice error',error.message))}finally{busy=false;updateButtons()}}
el('tabs').addEventListener('click',event=>{const button=event.target.closest('[data-kind]');if(!button||busy)return;kind=button.dataset.kind;page=0;for(const b of el('tabs').children)b.classList.toggle('active',b===button);load()});
el('search').addEventListener('submit',event=>{event.preventDefault();if(busy)return;page=0;load()});el('refresh').onclick=()=>load();el('prev').onclick=()=>{if(!busy&&page>0){page--;load()}};el('next').onclick=()=>{if(!busy&&(page+1)*20<total){page++;load()}};load();
</script></body></html>
